pcl_grid_map_extraction:
  num_processing_threads: 4
  cloud_transform:
    translation:
      x: 0.0
      y: 0.0
      z: 0.0
    rotation: #intrinsic rotation X-Y-Z (r-p-y)sequence
      r: 0.0
      p: 0.0
      y: 0.0
  cluster_extraction:
    cluster_tolerance: 2.0
    min_num_points: 1
    max_num_points: 1000000
    use_max_height_as_cell_elevation: false
  outlier_removal:
    is_remove_outliers: true
    mean_K: 10
    stddev_threshold: 1.0
  downsampling:
    is_downsample_cloud: false
    voxel_size:
      x: 0.02
      y: 0.02
      z: 0.02
  cropping:
    is_cropping_in_z: true
    cropping_limit_z_max: 3.0
    cropping_limit_z_min: -1000.0
  grid_map:
    min_num_points_per_cell: 1
    resolution: 0.35
  interpolation:
    resolution: 0.2
